name: Web application tests
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            ybar-web/backend/package-lock.json
            ybar-web/frontend/package-lock.json
      - run: npm ci
        working-directory: ybar-web/backend
      - run: npm ci
        working-directory: ybar-web/frontend
      - run: npm run build && npm test -- --runInBand
        working-directory: ybar-web/backend
      - run: npm run build && npm run typecheck:tests
        working-directory: ybar-web/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: ybar-web/frontend
      - run: npm run test:e2e
        working-directory: ybar-web/frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-results-node-${{ matrix.node }}
          path: |
            ybar-web/frontend/playwright-report/
            ybar-web/frontend/test-results/
          retention-days: 7
